# Format, lint, types, server tests and browser tests for pull requests and production deployments.
# No secrets: the tests use local D1, test secrets and a local mail stub.
name: Checks

on:
  pull_request:
  workflow_call:

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs vp (the version in pnpm-workspace.yaml's catalog), Node from .node-version and pnpm from
      # packageManager, then the dependencies exactly as locked.
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            args: ['--frozen-lockfile']
      - run: vp check
      - run: vp test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            args: ['--frozen-lockfile']
      - name: Install Chromium for the browser tests
        run: vp exec playwright install --with-deps chromium
      - run: vp run test:e2e --project=${{ matrix.project }}
      - name: Upload the browser test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.project }}
          path: output/playwright/
          retention-days: 7
